<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — Cockpit screens</title>
<!--
  THROWAWAY PROTOTYPE. Not app code.
  Round 3: every screen drawn in the vocabulary of board variant 4
  ("right status column, no dots"), so the style can be judged across the
  whole app rather than on one screen.

  Vocabulary being tested, applied everywhere:
    · no status dots — state lives in a right-hand column, one edge to scan
    · that column is always: word (semantic color) / duration / mono detail
    · sticky section headers on a 1px outline rule, mono counts
    · rows separated by 1px outline-variant, never boxed in cards
    · rows wanting attention take a tonal `surface` fill, never a pill
    · mono for paths, models, ids, counts, diffs — never for prose

  Tokens are ui/theme/Theme.kt verbatim; rules from ui/theme/DESIGN.md.
  Bottom bar and switcher both navigate; left/right arrows cycle screens.
-->
<style>
  :root{
    --background:#0B0C0E; --surface:#121316; --surface-variant:#1B1D21;
    --surface-high:#16171B; --surface-highest:#1A1C20;
    --on-surface:#ECEDF0; --on-surface-variant:#A8AEB9; --muted:#787E88;
    --primary:#5B8CFF; --on-primary:#0A1226;
    --primary-container:#1B2B54; --on-primary-container:#D8E4FF;
    --secondary:#46A758; --tertiary:#F5A524;
    --outline:#363B43; --outline-variant:#26292E;
    --error:#E5484D; --on-error:#3A0B0C;
    --added:#00C8FF; --deleted:#FF5B5B;
    --sans:Roboto,-apple-system,"Segoe UI",system-ui,sans-serif;
    --mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
    --ease:cubic-bezier(0.2,0,0,1); --dur:180ms;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#000;font-family:var(--sans);color:var(--on-surface);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:24px 16px 116px;gap:10px;
    -webkit-font-smoothing:antialiased}
  .stage-label{font-size:12px;color:#5c6069}
  .phone{width:392px;max-width:100%;height:812px;background:var(--background);border-radius:32px;
    border:1px solid #202329;overflow:hidden;display:flex;flex-direction:column;position:relative}
  .statusbar{height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;font-size:12.5px;font-weight:600;color:var(--on-surface-variant)}
  .screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative;
    display:flex;flex-direction:column}
  .screen::-webkit-scrollbar{display:none}
  .scroll{flex:1;overflow-y:auto;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}

  /* ---------------- shared shell ---------------- */
  .appbar{display:flex;align-items:center;gap:2px;padding:6px 6px 6px 20px;min-height:56px;
    flex:0 0 auto}
  .appbar h1{font-size:22px;font-weight:500;flex:1;letter-spacing:0}
  .appbar h1.sm{font-size:17px;font-weight:500;line-height:1.25}
  .appbar h1.sm em{display:block;font-style:normal;font-family:var(--mono);font-size:11px;
    color:var(--muted);margin-top:2px;font-weight:400}
  .iconbtn{width:48px;height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:center;
    color:var(--on-surface-variant);border-radius:24px;transition:background var(--dur) var(--ease)}
  .iconbtn:active{background:var(--surface-variant)}
  .iconbtn.on{color:var(--primary)}
  svg{display:block}

  /* section header — sticky, hairline, mono count */
  .sec{position:sticky;top:0;z-index:2;background:var(--background);
    padding:20px 20px 8px;border-bottom:1px solid var(--outline);
    display:flex;justify-content:space-between;align-items:baseline}
  .sec h2{font-size:12.5px;font-weight:600;color:var(--on-surface-variant);letter-spacing:.02em}
  .sec .n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

  /* the row + right status column that define this style */
  .row{display:flex;gap:16px;padding:14px 20px;align-items:flex-start;
    border-bottom:1px solid var(--outline-variant);transition:background var(--dur) var(--ease)}
  .row.hot{background:var(--surface)}
  .row:active{background:var(--surface-high)}
  .row .b{flex:1;min-width:0}
  .row .t{font-size:15px;font-weight:500;line-height:1.3}
  .row .a{font-size:13px;color:var(--on-surface-variant);margin-top:5px;line-height:1.42;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .row .p{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:7px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat{width:76px;flex:0 0 76px;text-align:right;padding-top:2px}
  .stat .k{font-size:11.5px;font-weight:600;display:block;letter-spacing:.01em}
  .stat .d{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;margin-top:4px}
  .stat .m{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:block;margin-top:8px}

  .lead{padding:0 20px 14px;font-size:13px;color:var(--on-surface-variant)}
  .empty{padding:80px 32px;text-align:center;color:var(--on-surface-variant);font-size:14px;
    line-height:1.5}
  .empty b{display:block;color:var(--on-surface);font-size:15px;font-weight:500;margin-bottom:6px}

  /* FAB — M3, 56dp, 16dp radius */
  .fab{position:absolute;right:16px;bottom:96px;width:56px;height:56px;border-radius:16px;
    background:var(--primary);color:var(--on-primary);display:flex;align-items:center;
    justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.5);z-index:4;
    transition:transform var(--dur) var(--ease)}
  .fab:active{transform:scale(.96)}

  /* M3 navigation bar */
  .navbar{flex:0 0 auto;height:80px;display:flex;border-top:1px solid var(--outline-variant);
    background:var(--background);padding-top:12px}
  .nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
  .nav .ind{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;
    justify-content:center;color:var(--on-surface-variant);position:relative;
    transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
  .nav[aria-current="true"] .ind{background:var(--primary-container);color:var(--on-primary-container)}
  .nav .lb{font-size:11.5px;color:var(--on-surface-variant);font-weight:500}
  .nav[aria-current="true"] .lb{color:var(--on-surface)}
  .badge{position:absolute;top:0;right:12px;min-width:16px;height:16px;border-radius:8px;
    background:var(--error);color:#fff;font-size:10.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
    font-family:var(--mono)}

  /* buttons */
  .btn{min-height:48px;border:0;border-radius:12px;font-family:inherit;font-size:15px;
    font-weight:500;cursor:pointer;padding:0 20px;transition:background var(--dur) var(--ease)}
  .btn.filled{background:var(--primary);color:var(--on-primary)}
  .btn.filled:active{background:#4A7AEB}
  .btn.tonal{background:var(--surface-variant);color:var(--on-surface)}
  .btn.tonal:active{background:var(--surface-highest)}
  .btn.text{background:none;color:var(--primary);padding:0 12px}
  .btn.text:active{background:var(--surface-variant)}
  .btn.text.mute{color:var(--on-surface-variant)}
  .btn.block{width:100%}
  .btn[disabled]{opacity:.38;pointer-events:none}

  .field{width:100%;background:var(--surface-high);border:1px solid var(--outline);
    border-radius:12px;padding:14px;color:var(--on-surface);font-family:var(--mono);
    font-size:13.5px;min-height:52px;transition:border-color var(--dur) var(--ease)}
  .field:focus{outline:none;border-color:var(--primary)}
  .field::placeholder{color:var(--muted)}
  .flabel{font-size:12.5px;color:var(--on-surface-variant);margin:18px 0 7px}

  /* prototype chrome — not part of the design */
  .switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:99;
    display:flex;align-items:center;gap:2px;background:#f2f2f4;color:#111;border-radius:999px;
    padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.6);font-size:13px}
  .switcher button{border:0;background:transparent;font-size:15px;width:30px;height:30px;
    border-radius:999px;cursor:pointer;color:#111}
  .switcher button:hover{background:#e2e2e5}
  .switcher .lbl{padding:0 12px;font-weight:600;white-space:nowrap;min-width:132px;text-align:center}
  .switcher .lbl small{font-weight:400;color:#6b6b70;margin-left:6px;font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion: reduce){*{transition-duration:1ms !important;
    animation-duration:1ms !important}}
</style>
</head>
<body>
<div class="stage-label">prototype · cockpit · style: right status column · <span id="stage"></span></div>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>◍ ▮▮ 82%</span></div>
  <div class="screen" id="screen"></div>
</div>
<div class="switcher">
  <button id="prev">←</button><span class="lbl" id="lbl"></span><button id="next">→</button>
</div>

<script>
/* ------------------------------- icons ------------------------------- */
const I = {
  board:  '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
  sessions:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.6V12l3 1.8"/></svg>',
  usage:  '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4.2-5.4"/></svg>',
  review: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/></svg>',
  search: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.4"/><path d="M16 16l4 4"/></svg>',
  gear:   '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M12 3.6v2.2M12 18.2v2.2M20.4 12h-2.2M5.8 12H3.6M17.9 6.1l-1.6 1.6M7.7 16.3l-1.6 1.6M17.9 17.9l-1.6-1.6M7.7 7.7L6.1 6.1"/></svg>',
  back:   '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  eye:    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 12S6 6.2 12 6.2 21.5 12 21.5 12 18 17.8 12 17.8 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>',
  plus:   '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  send:   '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12h14M13 6.5l5.5 5.5L13 17.5"/></svg>',
  more:   '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5.4" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18.6" r="1.6"/></svg>',
  chev:   '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  qr:     '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.8" y="3.8" width="6" height="6" rx="1.4"/><rect x="14.2" y="3.8" width="6" height="6" rx="1.4"/><rect x="3.8" y="14.2" width="6" height="6" rx="1.4"/><path d="M14.2 14.2h2.4v2.4h-2.4zM19 19h1.2v1.2H19z"/></svg>',
};

/* ------------------------------- data -------------------------------- */
const AGENTS = [
  { title:'Fix flaky socket test', path:'~/dev/agents-mobile', status:'needs_you', since:'4m',
    model:'opus-5', activity:'Delete the legacy pi/commands.ts shim, or keep it re-exporting?' },
  { title:'Port usage rings to Compose', path:'~/dev/agents-mobile', status:'needs_you', since:'12m',
    model:'sonnet-5', activity:'Permission to run ./gradlew connectedAndroidTest' },
  { title:'Bridge route table refactor', path:'~/dev/agents-mobile', status:'working', since:'2m',
    model:'opus-5', activity:'Editing routes/sessions.ts — extracting the dispatcher auth guard' },
  { title:'ntfy push retries', path:'~/dev/cockpit-bridge', status:'working', since:'27m',
    model:'sonnet-5', activity:'Running test suite — 34 of 61 passed' },
  { title:'QR pairing flow', path:'~/dev/agents-mobile', status:'done', since:'1h',
    model:'opus-5', activity:'18 tests green, +441 −27 across 9 files' },
  { title:'deepseek balance parser', path:'~/dev/scratch', status:'idle', since:'3h',
    model:'haiku-4.5', activity:'Waiting for input' },
];
const META = {
  needs_you:{label:'Needs you', color:'var(--error)',    short:'needs you'},
  working:  {label:'Working',   color:'var(--primary)',  short:'working'},
  done:     {label:'Done',      color:'var(--secondary)',short:'done'},
  idle:     {label:'Idle',      color:'var(--muted)',    short:'idle'},
};
const ORDER = ['needs_you','working','done','idle'];
const by = s => AGENTS.filter(a=>a.status===s);
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ----------------------------- shell parts ---------------------------- */
const appbar = (title, right='') =>
  `<div class="appbar"><h1>${title}</h1>${right}</div>`;
const topActions =
  `<div class="iconbtn" onclick="show('palette')">${I.search}</div>
   <div class="iconbtn" onclick="show('settings')">${I.gear}</div>`;
const backbar = (title, sub, right='') =>
  `<div class="appbar"><div class="iconbtn" onclick="show('board')">${I.back}</div>
    <h1 class="sm">${title}${sub?`<em>${sub}</em>`:''}</h1>${right}</div>`;

function navbar(active){
  const item = (key,label,icon,badge=0)=>`
    <div class="nav" aria-current="${active===key}" onclick="show('${key}')">
      <div class="ind">${icon}${badge?`<span class="badge">${badge}</span>`:''}</div>
      <div class="lb">${label}</div>
    </div>`;
  return `<div class="navbar">
    ${item('board','Board',I.board,2)}${item('sessions','Sessions',I.sessions)}
    ${item('usage','Usage',I.usage)}${item('review','Review',I.review)}</div>`;
}
/* the row shape every list on every screen reuses */
const row = ({title, activity, path, word, color, dur, meta, hot}) => `
  <div class="row ${hot?'hot':''}">
    <div class="b">
      <div class="t">${esc(title)}</div>
      ${activity?`<div class="a">${esc(activity)}</div>`:''}
      ${path?`<div class="p">${esc(path)}</div>`:''}
    </div>
    <div class="stat">
      <span class="k" style="color:${color}">${word}</span>
      ${dur?`<span class="d">${dur}</span>`:''}
      ${meta?`<span class="m">${meta}</span>`:''}
    </div>
  </div>`;

/* ================================ BOARD =============================== */
const Board = { name:'Board', render(){
  const sec = k => { const it = by(k); if(!it.length) return '';
    return `<div class="sec"><h2>${META[k].label}</h2><span class="n">${it.length}</span></div>
    ${it.map(a=>row({title:a.title, activity:a.activity, path:a.path,
      word:META[k].short, color:META[k].color, dur:a.since, meta:a.model,
      hot:k==='needs_you'})).join('')}`; };
  return `${appbar('Board', topActions)}
    <div class="scroll">${ORDER.map(sec).join('')}<div style="height:120px"></div></div>
    <div class="fab" onclick="show('new')">${I.plus}</div>
    ${navbar('board')}`;
}};

/* =============================== SESSIONS ============================= */
const SESSIONS = [
  {t:'Fix flaky socket test', p:'~/dev/agents-mobile · pane 4', w:'live', c:'var(--primary)',
   d:'4m', m:'opus-5', a:'Delete the legacy pi/commands.ts shim, or keep it re-exporting?', s:'Active'},
  {t:'Bridge route table refactor', p:'~/dev/agents-mobile · pane 2', w:'live', c:'var(--primary)',
   d:'2m', m:'opus-5', a:'Editing routes/sessions.ts', s:'Active'},
  {t:'QR pairing flow', p:'~/dev/agents-mobile · pane 7', w:'ended', c:'var(--secondary)',
   d:'1h', m:'opus-5', a:'18 tests green', s:'Recent'},
  {t:'Transcript parser merge', p:'~/dev/agents-mobile · pane 1', w:'ended', c:'var(--secondary)',
   d:'5h', m:'gpt-5.6', a:'Three parsers deleted, one module left', s:'Recent'},
  {t:'Herdr pane leak hunt', p:'~/dev/cockpit-bridge · pane 9', w:'archived', c:'var(--muted)',
   d:'2d', m:'sonnet-5', a:'', s:'Archived'},
  {t:'Usage ring math', p:'~/dev/scratch · pane 3', w:'archived', c:'var(--muted)',
   d:'6d', m:'haiku-4.5', a:'', s:'Archived'},
];
const Sessions = { name:'Sessions', render(){
  const groups = ['Active','Recent','Archived'];
  return `${appbar('Sessions', topActions)}
    <div class="scroll">
    ${groups.map(g=>{
      const it = SESSIONS.filter(s=>s.s===g);
      return `<div class="sec"><h2>${g}</h2><span class="n">${it.length}</span></div>
      ${it.map(s=>row({title:s.t, activity:s.a, path:s.p, word:s.w, color:s.c,
        dur:s.d, meta:s.m})).join('')}`;
    }).join('')}
    <div style="height:120px"></div></div>
    ${navbar('sessions')}`;
}};

/* ================================= CHAT =============================== */
const Chat = { name:'Chat', css:`
  .c-turn{border-bottom:1px solid var(--outline-variant);padding:16px 20px}
  .c-head{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
  .c-who{font-size:11.5px;font-weight:600;color:var(--on-surface-variant);letter-spacing:.02em}
  .c-when{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:auto}
  .c-user{background:var(--surface-highest);border-radius:14px;padding:12px 14px;
    font-size:14.5px;line-height:1.5}
  .c-text{font-size:14.5px;line-height:1.55;color:var(--on-surface)}
  .c-tool{margin-top:10px;background:var(--surface-variant);border-radius:12px;padding:10px 12px}
  .c-tool .h{font-family:var(--mono);font-size:11.5px;color:var(--on-surface-variant);
    display:flex;gap:7px;align-items:center}
  .c-tool .o{font-family:var(--mono);font-size:11.5px;color:rgba(236,237,240,.85);margin-top:7px;
    line-height:1.5;white-space:pre-wrap}
  .c-tool.err .h{color:var(--error)}
  .c-ask{background:var(--surface);border-bottom:1px solid var(--outline-variant);padding:16px 20px}
  .c-ask .lbl{font-size:11.5px;font-weight:600;color:var(--error);letter-spacing:.02em}
  .c-ask .q{font-size:15px;line-height:1.5;margin-top:9px}
  .c-composer{flex:0 0 auto;border-top:1px solid var(--outline-variant);padding:10px 12px 16px;
    display:flex;gap:8px;align-items:flex-end;background:var(--background)}
  .c-input{flex:1;background:var(--surface-high);border:1px solid var(--outline);border-radius:22px;
    padding:13px 16px;font-family:inherit;font-size:14.5px;color:var(--on-surface);
    resize:none;min-height:48px;max-height:120px;transition:border-color var(--dur) var(--ease)}
  .c-input:focus{outline:none;border-color:var(--primary)}
  .c-input::placeholder{color:var(--muted)}
  .c-send{width:48px;height:48px;flex:0 0 48px;border-radius:24px;border:0;background:var(--primary);
    color:var(--on-primary);display:flex;align-items:center;justify-content:center;cursor:pointer}
`, render(){
  return `${backbar('Fix flaky socket test','pane 4 · opus-5 · needs you',
      `<div class="iconbtn on">${I.eye}</div>`)}
    <div class="scroll" id="chatscroll">
      <div class="c-turn">
        <div class="c-head"><span class="c-who">You</span><span class="c-when">9:31</span></div>
        <div class="c-user">The socket test fails maybe one run in five. Find out why and fix it
          properly — no retries, no sleeps.</div>
      </div>
      <div class="c-turn">
        <div class="c-head"><span class="c-who">Agent</span><span class="c-when">9:33</span></div>
        <div class="c-text">The flake is a race between the test's fake herdr socket closing and
          the client's reconnect timer. The client schedules a retry before the close handler
          clears the pending timeout, so a sixth connection lands after the assertion.</div>
        <div class="c-tool"><div class="h">▸ bash</div>
          <div class="o">bun test bridge/test/sessions.test.ts --rerun-each 20</div></div>
        <div class="c-tool"><div class="h">▾ bash · output</div>
          <div class="o">18 pass, 2 fail
 fail: socket reconnect settles (attempt 6/20)</div></div>
      </div>
      <div class="c-turn">
        <div class="c-head"><span class="c-who">Agent</span><span class="c-when">9:36</span></div>
        <div class="c-text">Fixed by clearing the reconnect timer inside the close handler rather
          than the next tick. 20/20 runs green.</div>
        <div class="c-tool err"><div class="h">▸ read · pi/commands.ts</div>
          <div class="o">ENOENT — file was deleted in the route-table refactor</div></div>
      </div>

/* ------------------------------- runtime ------------------------------ */
const PAGES = {board:Board, chat:Chat, sessions:Sessions, review:Review, usage:Usage,
  new:NewSession, palette:Palette, settings:Settings, connect:Connect, offline:Offline};
const KEYS = Object.keys(PAGES);
const screen = document.getElementById('screen');
const styleEl = document.head.appendChild(document.createElement('style'));

const current = () => {
  const k = new URLSearchParams(location.search).get('page') || 'board';
  return KEYS.includes(k) ? k : 'board';
};
function render(){
  const k = current(), p = PAGES[k];
  // sheets/overlays render the board underneath, so carry its css too
  styleEl.textContent = (Board.css||'') + (p.css||'');
  screen.innerHTML = p.render();
  document.getElementById('lbl').innerHTML =
    `${p.name} <small>${KEYS.indexOf(k)+1}/${KEYS.length}</small>`;
  document.getElementById('stage').textContent = p.name;
  const s = screen.querySelector('#chatscroll');
  if (s) s.scrollTop = s.scrollHeight;
}
function show(k){
  const u = new URL(location); u.searchParams.set('page', k);
  history.replaceState({}, '', u); render();
}
function go(step){
  show(KEYS[(KEYS.indexOf(current()) + step + KEYS.length) % KEYS.length]);
}
document.getElementById('prev').onclick = ()=>go(-1);
document.getElementById('next').onclick = ()=>go(1);
addEventListener('keydown', e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if(e.key==='ArrowLeft') go(-1);
  if(e.key==='ArrowRight') go(1);
});
render();
</script>
